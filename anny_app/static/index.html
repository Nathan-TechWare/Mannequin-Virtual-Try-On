<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anny Body Mesh Adjuster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; flex-direction: column; height: 100vh;
         font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #eee; }

  #header { background: #1e1e2e; padding: 10px 20px;
             display: flex; align-items: center; justify-content: space-between;
             border-bottom: 1px solid #333; flex-shrink: 0; }
  #header h1 { font-size: 15px; font-weight: 600; color: #a0c4ff; }
  #subject-info { font-size: 12px; color: #888; }

  #main { display: flex; flex: 1; overflow: hidden; }

  #panel { width: 360px; min-width: 320px; background: #13131f;
           overflow-y: auto; padding: 10px 0;
           border-right: 1px solid #2a2a3e; flex-shrink: 0; }

  .section-title { background: #1e1e35; color: #a0c4ff;
                   font-size: 11px; font-weight: 700; letter-spacing: 1px;
                   padding: 8px 14px; margin: 8px 0 4px;
                   text-transform: uppercase; }

  .slider-row { display: flex; align-items: center;
                padding: 5px 14px; gap: 8px; }
  .slider-row label { width: 170px; font-size: 11px; color: #ccc; flex-shrink: 0; }
  .slider-row input[type=range] { flex: 1; accent-color: #4a9eff; cursor: pointer; }
  .slider-row .val { width: 50px; text-align: right; font-size: 11px;
                     font-weight: 700; color: #4a9eff;
                     font-variant-numeric: tabular-nums; }

  #viewport { flex: 1; position: relative; background: #0a0a14; overflow: hidden; }
  #viewport canvas { display: block; width: 100% !important; height: 100% !important; }

  #viewport-controls { position: absolute; top: 12px; right: 12px;
                        display: flex; flex-direction: column; gap: 8px; z-index: 10; }

  .btn-orange { background: #e65100; color: white; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px;
         font-size: 12px; font-weight: 600; cursor: pointer;
         transition: opacity 0.15s; }
  .btn:hover  { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-blue  { background: #1a73e8; color: white; }
  .btn-green { background: #2e7d32; color: white; }
  .btn-grey  { background: #444;    color: white; }

  #bottom-bar { background: #1e1e2e; padding: 8px 16px;
                display: flex; align-items: center; gap: 12px;
                border-top: 1px solid #2a2a3e; flex-shrink: 0; }
  #status { font-size: 11px; color: #888; flex: 1; }
  #bottom-buttons { display: flex; gap: 8px; }

  #loading { display: none; position: absolute; inset: 0;
             background: rgba(10,10,20,0.8);
             align-items: center; justify-content: center;
             flex-direction: column; gap: 14px; z-index: 20; }
  #loading.active { display: flex; }
  #loading-text { font-size: 13px; color: #a0c4ff; }
  .spinner { width: 40px; height: 40px; border: 3px solid #333;
             border-top-color: #4a9eff; border-radius: 50%;
             animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="header">
  <h1>Anny Body Mesh Adjuster</h1>
  <div id="subject-info">Loading...</div>
</div>

<div id="main">
  <div id="panel">
    <div class="section-title">Phenotypes [0.0 → 1.0]</div>
    <div id="phenotype-sliders"></div>
    <div class="section-title">Local Changes [−1.0 → +1.0]</div>
    <div id="local-sliders"></div>
  </div>

  <div id="viewport">
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Generating mesh...</div>
    </div>
    <div id="viewport-controls">
      <button class="btn btn-grey" onclick="resetCamera()">⟳ Reset View</button>
    </div>
  </div>
</div>

<div id="bottom-bar">
  <div id="status">Ready — adjust sliders then click Generate Mesh</div>
  <div id="bottom-buttons">
    <button class="btn btn-grey"   onclick="resetSliders()">↺ Reset to Measurements</button>
    <button class="btn btn-orange" id="reload-btn" onclick="reloadSubject()">⟳ Load New Subject</button>
    <button class="btn btn-blue"   id="gen-btn" onclick="generateMesh()">▶ Generate Mesh</button>
    <button class="btn btn-green"  id="exp-btn" onclick="exportMesh()">💾 Export .obj</button>
  </div>
</div>

<script src="/static/three.min.js"></script>
<script src="/static/OrbitControls.js"></script>
<script src="/static/GLTFLoader.js"></script>

<script>
// ── Three.js setup ────────────────────────────────────────────
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled  = true;
renderer.shadowMap.type     = THREE.PCFSoftShadowMap;
renderer.outputColorSpace   = THREE.SRGBColorSpace;
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d1a);
scene.fog = new THREE.FogExp2(0x0d0d1a, 0.04);

const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
camera.position.set(0, 1.0, 4.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping  = true;
controls.dampingFactor  = 0.06;
controls.minDistance    = 0.8;
controls.maxDistance    = 10;
controls.update();

// ── Lighting ──────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xfff0e0, 0.5);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff5e8, 1.4);
key.position.set(2, 5, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1;
key.shadow.camera.far  = 20;
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top   =  3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd0e8ff, 0.6);
fill.position.set(-3, 3, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffeedd, 0.3);
rim.position.set(0, -1, -3);
scene.add(rim);


// ── Floor ─────────────────────────────────────────────────────
const floorGeo = new THREE.CircleGeometry(3, 64);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x111122, roughness: 0.9, metalness: 0.0
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(6, 30, 0x1a1a33, 0x1a1a33);
scene.add(grid);


// ── Resize ────────────────────────────────────────────────────
function onResize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── Render loop ───────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

function resetCamera() {
  camera.position.set(0, 1.0, 4.5);
  controls.target.set(0, 0.9, 0);
  controls.update();
}

// ── GLTF Loader ───────────────────────────────────────────────
const loader   = new THREE.GLTFLoader();
let   bodyMesh = null;

function loadGLB(url) {
  return new Promise((resolve, reject) => {
    loader.load(url, gltf => resolve(gltf), undefined, reject);
  });
}

// ── Slider state ──────────────────────────────────────────────
let sliderVars  = {};
let initialVals = {};

const phenotypeLabels = {
  gender:      'Gender (0=Male → 1=Female)',
  age:         'Age (0=Infant → 1=Elderly)',
  height:      'Height',
  weight:      'Weight / Body Mass',
  muscle:      'Muscle',
  proportions: 'Proportions (Torso/Limb)',
  cupsize:     'Cup Size',
  firmness:    'Firmness / Tone',
  african:     'African',
  asian:       'Asian',
  caucasian:   'Caucasian',
};

const localLabels = {
    // Circumferences
    'measure-neck-circ-incr':        'Neck Circumference',
    'measure-waist-circ-incr':       'Waist Circumference',
    'measure-hips-circ-incr':        'Hip Circumference',
    'measure-bust-circ-incr':        'Bust / Chest',
    'measure-thigh-circ-incr':       'Thigh Circumference',
    'measure-calf-circ-incr':        'Calf Circumference',
    'measure-upperarm-circ-incr':    'Bicep Circumference',
    'measure-shoulder-dist-incr':    'Shoulder Breadth',
    'measure-wrist-circ-incr':       'Wrist Circumference',
    'measure-ankle-circ-incr':       'Ankle Circumference',
    // Arm lengths
    'measure-upperarm-length-incr':  'Upper Arm Length',
    'measure-lowerarm-length-incr':  'Lower Arm Length',
    // Forearm
    'l-lowerarm-fat-incr':           'Forearm Left Thickness',
    'r-lowerarm-fat-incr':           'Forearm Right Thickness',

    // Leg heights
    'measure-upperleg-height-incr':  'Upper Leg Height',
    'measure-lowerleg-height-incr':  'Lower Leg Height',
    // Torso
    'measure-napetowaist-dist-incr': 'Nape to Waist Distance',
};

// ── Unit conversion helpers ───────────────────────────────────
function phenotypeToHeight_cm(p) {
  // Reverse of map_height: p = (h - 140) / 60
  return 140.0 + p * 60.0;
}

function phenotypeToAge(p) {
  // Reverse of map_age: p = 0.5 + (a - 18) * (0.5/52)
  return 18.0 + (p - 0.5) * (52.0 / 0.5);
}

function cmToLocalValue(p, lo, hi) {
  // Reverse of incr: p = (val - mid) / (hi - lo) * 2
  const mid = (lo + hi) / 2.0;
  return mid + p * (hi - lo) / 2.0;
}

function cmToFeet(cm) {
  const totalInches = cm / 2.54;
  const feet        = Math.floor(totalInches / 12);
  const inches      = Math.round(totalInches % 12);
  return `${feet}'${inches}"`;
}

function formatValue(val, unit) {
  switch(unit) {
    case 'height_ft': {
      const cm = phenotypeToHeight_cm(val);
      return cmToFeet(cm);
    }
    case 'years': {
      const age = Math.round(phenotypeToAge(val));
      return `${Math.max(0, age)} yrs`;
    }
    case 'cm_neck':        return `${cmToLocalValue(val, 25.0, 55.0).toFixed(1)} cm`;
    case 'cm_waist':       return `${cmToLocalValue(val, 50.0, 130.0).toFixed(1)} cm`;
    case 'cm_hips':        return `${cmToLocalValue(val, 65.0, 145.0).toFixed(1)} cm`;
    case 'cm_bust':        return `${cmToLocalValue(val, 60.0, 140.0).toFixed(1)} cm`;
    case 'cm_thigh':       return `${cmToLocalValue(val, 35.0, 85.0).toFixed(1)} cm`;
    case 'cm_calf':        return `${cmToLocalValue(val, 22.0, 55.0).toFixed(1)} cm`;
    case 'cm_upperarm':    return `${cmToLocalValue(val, 18.0, 55.0).toFixed(1)} cm`;
    case 'cm_shoulder':    return `${cmToLocalValue(val, 25.0, 55.0).toFixed(1)} cm`;
    case 'cm_wrist':       return `${cmToLocalValue(val, 10.0, 25.0).toFixed(1)} cm`;
    case 'cm_ankle':       return `${cmToLocalValue(val, 15.0, 35.0).toFixed(1)} cm`;
    case 'cm_upperarm_len': return `${cmToLocalValue(val, 25.0, 40.0).toFixed(1)} cm`;
          case 'cm_lowerarm_len': return `${cmToLocalValue(val, 28.0, 42.0).toFixed(1)} cm`;
          case 'cm_forearm':      return `${cmToLocalValue(val, 18.0, 38.0).toFixed(1)} cm`;
          case 'cm_head':         return `${cmToLocalValue(val, 50.0, 65.0).toFixed(1)} cm`;
          case 'cm_upperleg':     return `${cmToLocalValue(val, 35.0, 55.0).toFixed(1)} cm`;
          case 'cm_lowerleg':     return `${cmToLocalValue(val, 28.0, 45.0).toFixed(1)} cm`;
          case 'cm_nape':         return `${cmToLocalValue(val, 32.0, 50.0).toFixed(1)} cm`;
    default:               return parseFloat(val).toFixed(3);
  }
}


function makeSlider(container, key, label, value, min, max, displayUnit) {
  const row = document.createElement('div');
  row.className = 'slider-row';

  const lbl = document.createElement('label');
  lbl.textContent = label;

  const slider = document.createElement('input');
  slider.type  = 'range';
  slider.min   = min;
  slider.max   = max;
  slider.step  = 0.001;
  slider.value = value;

  const valSpan = document.createElement('span');
  valSpan.className = 'val';
  valSpan.style.width = '64px';
  valSpan.textContent = formatValue(value, displayUnit);

  slider.addEventListener('input', () => {
    valSpan.textContent = formatValue(parseFloat(slider.value), displayUnit);
    sliderVars[key] = parseFloat(slider.value);
  });

  row.appendChild(lbl);
  row.appendChild(slider);
  row.appendChild(valSpan);
  container.appendChild(row);

  sliderVars[key]  = parseFloat(value);
  initialVals[key] = parseFloat(value);
}

// ── Load initial values ───────────────────────────────────────
fetch('/initial_values')
  .then(r => r.json())
  .then(d => {
    document.getElementById('subject-info').textContent =
      `Subject: ${d.gender.charAt(0).toUpperCase() + d.gender.slice(1)}  |  ` +
      `Height: ${d.height_cm}cm  |  Source: measurements.json`;

// Display units for each phenotype
    const phenotypeUnits = {
      gender:      null,
      age:         'years',
      height:      'height_ft',
      weight:      null,
      muscle:      null,
      proportions: null,
      cupsize:     null,
      firmness:    null,
      african:     null,
      asian:       null,
      caucasian:   null,
    };

    // Display units for each local change
    const localUnits = {
      'measure-neck-circ-incr':        'cm_neck',
      'measure-waist-circ-incr':       'cm_waist',
      'measure-hips-circ-incr':        'cm_hips',
      'measure-bust-circ-incr':        'cm_bust',
      'measure-thigh-circ-incr':       'cm_thigh',
      'measure-calf-circ-incr':        'cm_calf',
      'measure-upperarm-circ-incr':    'cm_upperarm',
      'measure-shoulder-dist-incr':    'cm_shoulder',
      'measure-wrist-circ-incr':       'cm_wrist',
      'measure-ankle-circ-incr':       'cm_ankle',
      'measure-upperarm-length-incr':  'cm_upperarm_len',
                'measure-lowerarm-length-incr':  'cm_lowerarm_len',
                'l-lowerarm-fat-incr':           'cm_forearm',
                'r-lowerarm-fat-incr':           'cm_forearm',
                'head-scale-horiz-incr':         'cm_head',
                'head-scale-vert-incr':          'cm_head',
                'head-scale-depth-incr':         'cm_head',
                'measure-upperleg-height-incr':  'cm_upperleg',
                'measure-lowerleg-height-incr':  'cm_lowerleg',
                'measure-napetowaist-dist-incr': 'cm_nape',

    };

    const pc = document.getElementById('phenotype-sliders');
    for (const [key, label] of Object.entries(phenotypeLabels))
      makeSlider(pc, key, label, d.phenotypes[key], 0, 1, phenotypeUnits[key]);

    const lc = document.getElementById('local-sliders');
    for (const [key, label] of Object.entries(localLabels))
      makeSlider(lc, key, label, d.local_changes[key], -1, 1, localUnits[key]);

    generateMesh();
  });

// ── Generate ──────────────────────────────────────────────────
function getCurrentValues() {
  const phenotypes    = {};
  const local_changes = {};
  for (const k of Object.keys(phenotypeLabels))    phenotypes[k]    = sliderVars[k];
  for (const k of Object.keys(localLabels))        local_changes[k] = sliderVars[k];
  return { phenotypes, local_changes };
}

function setLoading(on, text = 'Generating mesh...') {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading').classList.toggle('active', on);
  document.getElementById('gen-btn').disabled = on;
  document.getElementById('exp-btn').disabled = on;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

async function generateMesh() {
  setLoading(true);
  setStatus('Sending to Anny...');

  try {
    const resp = await fetch('/generate', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(getCurrentValues()),
    });

    if (!resp.ok) throw new Error(`Server error: ${resp.status}`);

    const blob   = await resp.blob();
    const url    = URL.createObjectURL(blob);
    const gltf   = await loadGLB(url);
    URL.revokeObjectURL(url);

    // Remove old mesh
    if (bodyMesh) {
      scene.remove(bodyMesh);
      bodyMesh.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
    }

    bodyMesh = gltf.scene;

    // Apply smooth skin material
bodyMesh.traverse(child => {
    if (child.isMesh) {
        child.castShadow    = true;
        child.receiveShadow = true;
        child.material = new THREE.MeshStandardMaterial({
            color:          0xc8a882,
            roughness:      0.65,
            metalness:      0.0,
            side:           THREE.FrontSide,
        });
        child.geometry.computeVertexNormals();
    }
});

    // Centre on floor
    const box = new THREE.Box3().setFromObject(bodyMesh);
    const centre = box.getCenter(new THREE.Vector3());
    bodyMesh.position.sub(centre);
    bodyMesh.position.y += (box.max.y - box.min.y) / 2;

    scene.add(bodyMesh);

    // Aim camera at body centre
    const height = box.max.y - box.min.y;
    controls.target.set(0, height / 2, 0);
    controls.update();

    setLoading(false);
    setStatus('✔ Mesh ready — drag to rotate · scroll to zoom · right-drag to pan');

  } catch(e) {
    setLoading(false);
    setStatus('Error: ' + e.message);
    console.error(e);
  }
}



// ── ReloadSubject ─────────────────────────────────────────────────────
async function reloadSubject() {
  setStatus('Reloading measurements from file...');
  try {
    const resp = await fetch('/reload_measurements', { method: 'POST' });
    const d    = await resp.json();

    // Update header
    document.getElementById('subject-info').textContent =
      `Subject: ${d.gender.charAt(0).toUpperCase() + d.gender.slice(1)}  |  ` +
      `Height: ${d.height_cm}cm  |  Source: measurements.json`;

    // Reset all sliders to new values
    document.querySelectorAll('.slider-row').forEach(row => {
      const label  = row.querySelector('label').textContent;
      const slider = row.querySelector('input');
      const val    = row.querySelector('.val');
      const allLabels = { ...phenotypeLabels, ...localLabels };
      const key = Object.keys(allLabels).find(k => allLabels[k] === label);
      if (!key) return;

      const newVal = d.phenotypes[key] !== undefined
        ? d.phenotypes[key]
        : d.local_changes[key];

      if (newVal !== undefined) {
        slider.value    = newVal;
        sliderVars[key] = newVal;
        initialVals[key] = newVal;
        val.textContent = formatValue(newVal, getUnit(key));
      }
    });

    if (d.warnings && d.warnings.length > 0) {
      setStatus(`⚠ Loaded new subject — ${d.warnings.length} validation warning(s). Check terminal.`);
    } else {
      setStatus(`✔ Loaded new subject: ${d.gender} ${d.height_cm}cm — click Generate Mesh`);
    }

  } catch(e) {
    setStatus('Error reloading: ' + e.message);
  }
}

function getUnit(key) {
  const phenotypeUnits = {
    gender: null, age: 'years', height: 'height_ft',
    weight: null, muscle: null, proportions: null,
    cupsize: null, firmness: null, african: null, asian: null, caucasian: null,
  };
  const localUnits = {
    'measure-neck-circ-incr':        'cm_neck',
    'measure-waist-circ-incr':       'cm_waist',
    'measure-hips-circ-incr':        'cm_hips',
    'measure-bust-circ-incr':        'cm_bust',
    'measure-thigh-circ-incr':       'cm_thigh',
    'measure-calf-circ-incr':        'cm_calf',
    'measure-upperarm-circ-incr':    'cm_upperarm',
    'measure-shoulder-dist-incr':    'cm_shoulder',
    'measure-wrist-circ-incr':       'cm_wrist',
    'measure-ankle-circ-incr':       'cm_ankle',
    'measure-upperarm-length-incr':  'cm_upperarm_len',
    'measure-lowerarm-length-incr':  'cm_lowerarm_len',
    'l-lowerarm-fat-incr':           'cm_forearm',
    'r-lowerarm-fat-incr':           'cm_forearm',
    'head-scale-horiz-incr':         'cm_head',
    'head-scale-vert-incr':          'cm_head',
    'head-scale-depth-incr':         'cm_head',
    'measure-upperleg-height-incr':  'cm_upperleg',
    'measure-lowerleg-height-incr':  'cm_lowerleg',
    'measure-napetowaist-dist-incr': 'cm_nape',
  };
  return phenotypeUnits[key] !== undefined ? phenotypeUnits[key] : localUnits[key];
}

// ── Reset ─────────────────────────────────────────────────────
function resetSliders() {
  document.querySelectorAll('.slider-row').forEach(row => {
    const label  = row.querySelector('label').textContent;
    const slider = row.querySelector('input');
    const val    = row.querySelector('.val');
    const allLabels = { ...phenotypeLabels, ...localLabels };
    const key = Object.keys(allLabels).find(k => allLabels[k] === label);
    if (key && initialVals[key] !== undefined) {
      slider.value    = initialVals[key];
      val.textContent = parseFloat(initialVals[key]).toFixed(3);
      sliderVars[key] = initialVals[key];
    }
  });
  setStatus('Reset to measurement-derived values');
}

// ── Export ────────────────────────────────────────────────────
async function exportMesh() {
  setLoading(true, 'Exporting...');
  try {
    const resp = await fetch('/export', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(getCurrentValues()),
    });
    const d = await resp.json();
    setLoading(false);
    setStatus(`✔ Saved: ${d.saved}`);
  } catch(e) {
    setLoading(false);
    setStatus('Export error: ' + e.message);
  }
}

</script>
</body>
</html>
